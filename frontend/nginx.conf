server {
    listen ${PORT};
    server_name _;
    resolver ${RESOLVER} ipv6=off valid=10s;
    root /usr/share/nginx/html;
    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://accounts.google.com; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com" always;

    location /api/ {
        set $backend_url http://${BACKEND_HOSTPORT};
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        set $backend_url http://${BACKEND_HOSTPORT};
        proxy_pass $backend_url;
    }

    location /admin/ {
        set $backend_url http://${BACKEND_HOSTPORT};
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health/ {
        set $backend_url http://${BACKEND_HOSTPORT};
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
